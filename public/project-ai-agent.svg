<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" fill="#09090b"/>
  <defs>
    <pattern id="grid-ai" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272a"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid-ai)"/>

  <!-- Outer Technical Frames -->
  <rect x="20" y="20" width="760" height="460" stroke="#3f3f46" stroke-width="2"/>
  <rect x="28" y="28" width="744" height="444" stroke="#27272a" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Top Header Strip -->
  <rect x="20" y="20" width="760" height="36" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
  <text x="36" y="43" fill="#ef4444" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">ARC.01 // SYSTEM ARCHITECTURE: MULTI_AGENT_ORCHESTRATOR</text>
  <text x="640" y="43" fill="#71717a" font-family="monospace" font-size="11" letter-spacing="1">STATUS: ONLINE // RBAC</text>

  <!-- Left Metrics Telemetry Pod -->
  <g transform="translate(45, 80)">
    <rect width="190" height="270" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <rect x="0" y="0" width="190" height="26" fill="#27272a"/>
    <text x="12" y="18" fill="#fafafa" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1">ORCHESTRATION SPECS</text>
    
    <text x="14" y="52" fill="#a1a1aa" font-family="monospace" font-size="10">STACK: NEXT.JS 15 (RSC)</text>
    <text x="14" y="74" fill="#a1a1aa" font-family="monospace" font-size="10">RBAC: MULTI-TENANT ADMIN</text>
    <text x="14" y="96" fill="#a1a1aa" font-family="monospace" font-size="10">STATE: REACT HOOKS / ZUSTAND</text>
    <text x="14" y="118" fill="#a1a1aa" font-family="monospace" font-size="10">TELEMETRY: REAL-TIME TOKENS</text>
    <text x="14" y="140" fill="#ef4444" font-family="monospace" font-size="10">DISPATCH: STREAMING CHAT</text>
    <text x="14" y="162" fill="#a1a1aa" font-family="monospace" font-size="10">LATENCY: &lt;32ms TTFT</text>

    <!-- Activity Bars -->
    <g transform="translate(14, 185)">
      <rect x="0" y="25" width="10" height="35" fill="#ef4444"/>
      <rect x="16" y="10" width="10" height="50" fill="#71717a"/>
      <rect x="32" y="18" width="10" height="42" fill="#ef4444"/>
      <rect x="48" y="5" width="10" height="55" fill="#fafafa"/>
      <rect x="64" y="30" width="10" height="30" fill="#ef4444"/>
      <rect x="80" y="15" width="10" height="45" fill="#71717a"/>
      <rect x="96" y="22" width="10" height="38" fill="#ef4444"/>
      <rect x="112" y="8" width="10" height="52" fill="#fafafa"/>
    </g>
    <text x="14" y="255" fill="#71717a" font-family="monospace" font-size="9">QUEUE: 000 ACTIVE THREADS</text>
  </g>

  <!-- Central Multi-Agent Node Graph -->
  <g transform="translate(260, 80)">
    <!-- Connecting Vector Buses -->
    <line x1="240" y1="160" x2="130" y2="70" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="240" y1="160" x2="350" y2="70" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="240" y1="160" x2="130" y2="250" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="240" y1="160" x2="350" y2="250" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Central Agent Core (Orchestrator) -->
    <circle cx="240" cy="160" r="58" fill="#18181b" stroke="#ef4444" stroke-width="2"/>
    <circle cx="240" cy="160" r="48" stroke="#3f3f46" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="240" cy="160" r="10" fill="#ef4444"/>
    <text x="240" y="138" fill="#fafafa" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">PRIMARY</text>
    <text x="240" y="152" fill="#ef4444" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">AGENT CORE</text>
    <text x="240" y="180" fill="#71717a" font-family="monospace" font-size="9" text-anchor="middle">AUTONOMOUS</text>

    <!-- Node 1: Prompt Engine -->
    <rect x="50" y="45" width="130" height="48" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <rect x="50" y="45" width="4" height="48" fill="#ef4444"/>
    <text x="64" y="65" fill="#fafafa" font-family="monospace" font-size="10" font-weight="bold">PROMPT ENGINE</text>
    <text x="64" y="80" fill="#a1a1aa" font-family="monospace" font-size="9">DYNAMIC PIPELINE</text>

    <!-- Node 2: Vector Store -->
    <rect x="300" y="45" width="130" height="48" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <rect x="300" y="45" width="4" height="48" fill="#ef4444"/>
    <text x="314" y="65" fill="#fafafa" font-family="monospace" font-size="10" font-weight="bold">VECTOR EMBED</text>
    <text x="314" y="80" fill="#a1a1aa" font-family="monospace" font-size="9">512-D RETRIEVER</text>

    <!-- Node 3: RBAC Delegation -->
    <rect x="50" y="225" width="130" height="48" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <rect x="50" y="225" width="4" height="48" fill="#ef4444"/>
    <text x="64" y="245" fill="#fafafa" font-family="monospace" font-size="10" font-weight="bold">RBAC POLICY</text>
    <text x="64" y="260" fill="#a1a1aa" font-family="monospace" font-size="9">HIERARCHY MESH</text>

    <!-- Node 4: Tool Bus -->
    <rect x="300" y="225" width="130" height="48" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <rect x="300" y="225" width="4" height="48" fill="#ef4444"/>
    <text x="314" y="245" fill="#fafafa" font-family="monospace" font-size="10" font-weight="bold">ACTION EXECUTOR</text>
    <text x="314" y="260" fill="#a1a1aa" font-family="monospace" font-size="9">TOOL ROUTER</text>

    <!-- Scanning Reticle Rings -->
    <circle cx="240" cy="160" r="120" stroke="#ef4444" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="8 8"/>
  </g>

  <!-- Bottom Technical Strip -->
  <g transform="translate(45, 380)">
    <rect width="710" height="75" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="25" fill="#a1a1aa" font-family="monospace" font-size="10">EVENT STREAM // WEBSOCKET DUPLEX</text>
    <text x="20" y="45" fill="#71717a" font-family="monospace" font-size="9">TRACE ID: 0x8F9C2B14 • PERMISSION TIER: SUPER_ADMIN • MULTI-TENANT ISOLATION: ACTIVE</text>
    <text x="20" y="62" fill="#ef4444" font-family="monospace" font-size="9">LIVE AGENT TELEMETRY: HARMONIZED WITH NEXT.JS 15 RUNTIME</text>

    <text x="560" y="45" fill="#fafafa" font-family="monospace" font-size="11" font-weight="bold">DISPATCH: 100%</text>
  </g>
</svg>
