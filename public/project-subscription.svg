<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" fill="#09090b"/>
  <defs>
    <pattern id="dot-grid-4" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272a"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#dot-grid-4)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="760" height="460" stroke="#3f3f46" stroke-width="2"/>
  <rect x="28" y="28" width="744" height="444" stroke="#27272a" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Header Bar -->
  <rect x="20" y="20" width="760" height="36" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
  <text x="36" y="44" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">ARC.04 // BACKEND SCHEMATIC: SUBSCRIPTION_AUTOMATION_ENGINE</text>
  <text x="660" y="44" fill="#71717a" font-family="monospace" font-size="11" letter-spacing="1">CRON: ACTIVE</text>

  <!-- Node Architecture Pipeline Diagram -->
  <g transform="translate(60, 95)">
    <!-- Stage 1: Auth & Ingress -->
    <g transform="translate(0, 40)">
      <rect width="180" height="180" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
      <rect width="180" height="26" fill="#27272a"/>
      <text x="14" y="18" fill="#fafafa" font-family="monospace" font-size="10" font-weight="bold">STAGE 01 // INGRESS</text>
      
      <text x="14" y="55" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold">> JWT AUTH FILTER</text>
      <text x="14" y="80" fill="#a1a1aa" font-family="monospace" font-size="10">REQ VALIDATION</text>
      <text x="14" y="105" fill="#a1a1aa" font-family="monospace" font-size="10">RATE LIMITING</text>
      <text x="14" y="130" fill="#a1a1aa" font-family="monospace" font-size="10">EXPRESS ROUTER</text>
      <rect x="14" y="145" width="150" height="20" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
      <text x="24" y="159" fill="#71717a" font-family="monospace" font-size="9">PORT: 5000 // REST</text>
    </g>

    <!-- Connector 1 -->
    <path d="M 180 130 L 250 130" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="250,130 242,126 242,134" fill="#c084fc"/>

    <!-- Stage 2: Business Logic & Renewal Lifecycle -->
    <g transform="translate(250, 20)">
      <rect width="200" height="220" fill="#18181b" stroke="#c084fc" stroke-width="1.5"/>
      <rect width="200" height="26" fill="#c084fc" fill-opacity="0.2"/>
      <text x="14" y="18" fill="#c084fc" font-family="monospace" font-size="10" font-weight="bold">STAGE 02 // ENGINE CORE</text>

      <text x="14" y="52" fill="#fafafa" font-family="monospace" font-size="11" font-weight="bold">LIFECYCLE SCHEDULER</text>
      <text x="14" y="75" fill="#a1a1aa" font-family="monospace" font-size="10">AUTO-RENEWAL CRON</text>
      <text x="14" y="98" fill="#a1a1aa" font-family="monospace" font-size="10">EXPIRATION WARNING</text>
      <text x="14" y="121" fill="#a1a1aa" font-family="monospace" font-size="10">EMAIL NOTIFICATIONS</text>
      <text x="14" y="144" fill="#a1a1aa" font-family="monospace" font-size="10">ERROR BOUNDARIES</text>
      <text x="14" y="167" fill="#a1a1aa" font-family="monospace" font-size="10">TRANSACTION ROLLS</text>

      <rect x="14" y="185" width="170" height="22" fill="#09090b" stroke="#c084fc" stroke-width="1"/>
      <text x="22" y="200" fill="#c084fc" font-family="monospace" font-size="9">LOOP: 00:00 UTC DAILY</text>
    </g>

    <!-- Connector 2 -->
    <path d="M 450 130 L 520 130" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="520,130 512,126 512,134" fill="#c084fc"/>

    <!-- Stage 3: Persistence Layer -->
    <g transform="translate(520, 40)">
      <rect width="170" height="180" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
      <rect width="170" height="26" fill="#27272a"/>
      <text x="14" y="18" fill="#fafafa" font-family="monospace" font-size="10" font-weight="bold">STAGE 03 // STORAGE</text>

      <text x="14" y="55" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold">MONGODB CLUSTER</text>
      <text x="14" y="80" fill="#a1a1aa" font-family="monospace" font-size="10">USER SCHEMAS</text>
      <text x="14" y="105" fill="#a1a1aa" font-family="monospace" font-size="10">PLAN INDEXES</text>
      <text x="14" y="130" fill="#a1a1aa" font-family="monospace" font-size="10">AUDIT LOG STORE</text>
      <rect x="14" y="145" width="140" height="20" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
      <text x="22" y="159" fill="#71717a" font-family="monospace" font-size="9">ENCRYPTED AT REST</text>
    </g>
  </g>

  <!-- Bottom Data Strip -->
  <g transform="translate(45, 410)">
    <rect width="710" height="45" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="28" fill="#71717a" font-family="monospace" font-size="11">NODE.JS // EXPRESS.JS // MONGODB ATLAS // JWT // CRON SCHEDULER // PRODUCTION LOGGING</text>
    <circle cx="680" cy="22" r="5" fill="#c084fc"/>
  </g>
</svg>
